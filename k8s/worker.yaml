# worker-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1 # You might want multiple workers
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - name: worker
        image: 192.168.2.53:32228/model:v1
        command: ["celery"]
        args: ["-A", "workerA", "worker", "--loglevel=debug"]
        env:
        - name: RABBITMQ_HOST
          value: "rabbitmq"
        - name: RABBITMQ_USER
          value: "rabbitmq"
        - name: RABBITMQ_PASSWORD
          value: "rabbitmq"
