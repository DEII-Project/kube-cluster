apiVersion: v1
kind: Namespace
metadata:
  name: stargazer-app
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: stargazer-app
spec:
  ports:
    - port: 5672
      name: amqp
  selector:
    app: rabbitmq
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: stargazer-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management
          ports:
            - containerPort: 5672
            - containerPort: 15672
---
apiVersion: v1
kind: Service
metadata:
  name: stargazer-web
  namespace: stargazer-app
spec:
  selector:
    app: stargazer-web
  ports:
    - protocol: TCP
      port: 5100
      targetPort: 5100
      nodePort: 31000
  type: NodePort

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stargazer-web
  namespace: stargazer-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stargazer-web
  template:
    metadata:
      labels:
        app: stargazer-web
    spec:
      containers:
        - name: web
          # image: zhiming0545/stargazer-web:latest
          image: 192.168.2.53:32228/model:v1
          ports:
            - containerPort: 8000
          env:
            - name: CELERY_BROKER_URL
              value: amqp://guest:guest@rabbitmq:5672//
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stargazer-worker
  namespace: stargazer-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: stargazer-worker
  template:
    metadata:
      labels:
        app: stargazer-worker
    spec:
      containers:
        - name: worker
          # image: lukasbruna/stargazer_worker_1:latest
          image: 192.168.2.53:32228/model:v1
          command: ["celery", "-A", "worker", "worker", "--loglevel=info"]
          env:
            - name: CELERY_BROKER_URL
              value: amqp://guest:guest@rabbitmq:5672//
