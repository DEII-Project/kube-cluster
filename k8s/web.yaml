# web-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 3 # Adjust as needed
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: 192.168.2.53:32228/model:v1 # Replace with your built image
        ports:
        - containerPort: 5100
        env:
        - name: RABBITMQ_HOST
          value: "rabbitmq" # Matches the service name
        - name: RABBITMQ_USER
          value: "rabbitmq"
        - name: RABBITMQ_PASSWORD
          value: "rabbitmq"
---
# web-service.yaml
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: web
  ports:
    - port: 5100
      targetPort: 5100
  type: NodePort # Or NodePort/ClusterIP based on your needs
