- hosts: kube_control_plane
  become: yes
  vars_files:
    - ../../vars.yml
  tasks:
    - name: Initialize k8s cluster
      shell: kubeadm init --pod-network-cidr=10.244.0.0/16
      args:
        chdir: $HOME
        creates: cluster_initialized.txt

    - name: Create .kube directory
      become: true
      become_user: ansible
      ansible.builtin.file:
        path: $HOME/.kube
        state: directory
        mode: "0755"

    - name: Copy admin.conf to user kube config
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/ansible/.kube/config
        remote_src: true
        owner: ansible:ansible
      become: yes
      become_user: root

    - name: Install Pod network
      become: yes
      become_user: ansible
      ansible.builtin.shell: |
        kubectl create -f https://raw.githubusercontent.com/projectcalico/calico/v3.30.0/manifests/canal.yaml
      args:
        chdir: $HOME

    - name: Get token to join worker nodes to k8s cluster
      become: yes
      become_user: root
      ansible.builtin.shell: kubeadm token create --print-join-command
      register: kubernetes_join_command

- hosts: kube_workers
  become: yes
  gather_facts: yes
  vars_files:
    - ../../vars.yml
  tasks:
    - name: Join the Worker nodes to the cluster.
      become: yes
      become_user: root
      command: sh {{ kubernetes_join_command.stdout }}
      register: joined_or_not

    - name: Node join status
      ansible.builtin.debug:
        msg: "{{ joined_or_not.stdout }}"
