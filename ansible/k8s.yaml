- hosts: all
  name: Sets sandbox version to 3.10, enables cri plugin and use systemd as cgroup driver
  tasks:
    - name: Copy containerd config
      ansible.builtin.copy:
        src: ../k8s/containerd/config.toml
        dest: /etc/containerd/config.toml
        owner: root
        group: root
        mode: "0644"
      become: true
      become_user: root
    - name: Restart containerd
      ansible.builtin.command:
        argv: ["systemctl", "restart", "containerd.service"]
      become: true
      become_user: root

- hosts: kube_control_plane
  name: Setting up the Control Plane
  tasks:
    - name: Initialize k8s cluster
      shell: kubeadm init --pod-network-cidr=10.244.0.0/16
      become: true
      args:
        chdir: $HOME
        creates: cluster_initialized.txt

    - name: Create .kube directory
      become: true
      become_user: ansible
      ansible.builtin.file:
        path: $HOME/.kube
        state: directory
        mode: "0755"

    - name: Copy admin.conf to user kube config
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/ansible/.kube/config
        remote_src: true
        owner: ansible
      become: true
      become_user: root

    - name: Install Pod network
      become: yes
      become_user: ansible
      ansible.builtin.shell: |
        kubectl create -f https://raw.githubusercontent.com/projectcalico/calico/v3.30.0/manifests/canal.yaml
      args:
        chdir: $HOME
