- name: Sets sandbox version to 3.10, enables cri plugin and use systemd as cgroup driver
  hosts: all
  tasks:
    - name: Copy containerd config
      ansible.builtin.copy:
        src: ./configs/containerd/config.toml
        dest: /etc/containerd/config.toml
        owner: root
        group: root
        mode: "0644"
      become: true
      become_user: root
    - name: Restart containerd
      cmd: systemctl restart containerd.service
      become: true
      become_user: root

- name: Setting up the Control Plane
  hosts: kube_control_plane
  tasks:
    - name: Initialize k8s cluster
      become: true
      cmd: kubeadm init --pod-network-cidr=10.244.0.0/16
      args:
        chdir: $HOME
        creates: cluster_initialized.txt

    - name: Create .kube directory
      become: true
      become_user: ansible
      ansible.builtin.file:
        path: $HOME/.kube
        state: directory
        mode: "0755"

    - name: Copy admin.conf to user kube config
      become: true
      become_user: root
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/ansible/.kube/config
        remote_src: true
        owner: ansible

    - name: Install Pod network
      become: yes
      become_user: ansible
      ansible.builtin.shell: |
        kubectl create -f https://raw.githubusercontent.com/projectcalico/calico/v3.30.0/manifests/canal.yaml
      args:
        chdir: $HOME
    - name: Get token to join worker nodes to k8s cluster
      become: yes
      become_user: root
      ansible.builtin.shell: kubeadm token create --print-join-command
      register: kubernetes_join_command

    - name: Write the join command locally
      ansible.builtin.copy:
        content: "{{kubernetes_join_command.stdout}}"
        dest: ./join-command
      delegate_to: localhost
