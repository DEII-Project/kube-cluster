#cloud-config

ssh_pwauth: false
package_update: false
package_upgrade: false

users:
  - default
  - name: ansible
    gecos: Ansible User
    shell: /bin/bash
    groups: users,admin,wheel
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMvcsaBqwk+zihKMNe2nMTt6NUwoqZugLN96RGf9JU/X shahab@shahab-x542urr546897
      - ANSIBLE_PUBLIC_KEY
apt:
  sources:
    docker.list:
      source: deb [arch=amd64] https://download.docker.com/linux/ubuntu $RELEASE stable
      keyid: 9DC858229FC7DD38854AE2D88D81803C0EBFCD88
    kubernetes.list:
      source: deb https://pkgs.k8s.io/core:/stable:/v1.33/deb/ /
      keyid: DE15B14486CD377B9E876E1A234654DA9A296436

packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gpg
  - python3-pip
  - git
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
  - kubectl

write_files:
  - path: /home/ansible/.ssh/id_rsa
    owner: ansible:ansible
    permissions: 0o600
    defer: True
    content: |
      ANSIBLE_PRIVATE_KEY
  - path: /etc/hosts
    append: true
    content: "NODENAMES"
  - path: /etc/ansible/hosts
    append: true
    content: "ANSIBLE_INVENTORY"

ansible:
  package_name: ansible-core
  install_method: distro
  run_user: ansible
